[package]
name = "acquisition"
version = "0.1.0"
edition = "2024"
description = "High-speed read-only acquisition and fragment extraction layer (Part 3)"

# io_uring is Linux-only; the crate compiles on all platforms via cfg gates.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dependencies]
anyhow    = "1"
thiserror = "2"
sha2      = "0.10"
hex       = "0.4"
memchr    = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "acquisition"
path = "src/lib.rs"

[[bin]]
name = "acq-benchmark"
path = "src/bin/benchmark.rs"

[lints.rust]
warnings = "deny"
