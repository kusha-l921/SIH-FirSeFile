[package]
name = "firsefile"
version = "0.1.0"
description = "FirSeFile Forensic Recovery Engine"
edition = "2021"
default-run = "firsefile"

[lib]
name = "firsefile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
clap = { version = "4.6", features = ["derive"] }
acquisition = { path = "../../src/acquisition" }
xfs-recovery-engine = { path = "../../src/recovery/xfs" }
blockchain_ledger_core = { path = "../../blockchain_ledger/core" }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
